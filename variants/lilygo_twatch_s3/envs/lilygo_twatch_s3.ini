[env:lilygo_twatch_s3]
extends = arduino_base
board = lilygo-t-watch-s3
upload_speed = 115200
board_build.psram_type = qspi
build_src_filter =
    +<*>
    -<ui/screens/chat/>
    -<modules/ui_shared/src/ui/screens/chat/>
build_flags =
    ${arduino_base.build_flags}
    -DARDUINO_LOOP_STACK_SIZE=8192
    -DBOARD_HAS_PSRAM=1
    -DCONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=1
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=4
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=185
    -DARDUINO_T_WATCH_S3
    -DARDUINO_LILYGO_LORA_SX1262
    -DTRAIL_MATE_LORA_TX_POWER_MAX_DBM=22
    -DDISPLAY_DRIVER_ST7789V2
    -DSCREEN_WIDTH=240
    -DSCREEN_HEIGHT=240
    -DHAS_GPS=0
    -DHAS_SD=0
    -DHAS_PSRAM=1
    -DTRAIL_MATE_WATCH_MORSE_PDM_SCK=44
    -DTRAIL_MATE_WATCH_MORSE_PDM_DATA=47
    -DUSING_INPUT_DEV_TOUCHPAD
    -I variants/lilygo_twatch_s3
lib_deps =
    ${arduino_base.lib_deps}
lib_ignore =
    ${arduino_base.lib_ignore}
    boards_tdeck
    boards_tdeck_pro
    boards_tlora_pager
    boards_tab5
    boards_t_display_p4
    boards_t_echo_lite

