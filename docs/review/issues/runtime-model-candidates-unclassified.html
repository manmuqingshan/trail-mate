<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>系统与媒体 Runtime 模型候选待裁决</title></head><body><main data-praxis-anchor="finding:runtime-model-candidates-unclassified"><h1>P2 · 【候选待裁决】系统与媒体 Runtime 尚未完成 Model-or-Projection 分类</h1><p>当前九个 Registry 模型不是“已经足够”的结论。实时通话、内容包安装、固件更新和 Wi-Fi 资源租约都有稳定状态语言，但 owner 仍主要位于 platform/ui runtime。</p><h2>候选</h2><ol><li>Reticulum 实时通话会话</li><li>内容包安装生命周期</li><li>固件更新生命周期</li><li>Wi-Fi 资源租约与抢占策略</li></ol><p>它们必须逐项裁决为独立模型、现有模型元素、应用工作流或集成投影；不能继续漏报，也不能先制造空壳模型。</p></main></body></html>
