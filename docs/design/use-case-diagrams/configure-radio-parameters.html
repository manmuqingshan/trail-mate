<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>切换活动协议并提交无线配置</title></head><body><main data-praxis-anchor="use-case:configure-radio-parameters" data-praxis-kind="design_use_case_diagram" data-praxis-status="confirmed" data-praxis-confidence="high" data-praxis-source-md="docs/design/use-case-diagrams/configure-radio-parameters.md"><h1>切换活动协议并提交无线配置</h1><p>安全释放旧 backend，加载协议分区身份/频道/密钥，只有新 backend 启动且保存成功后才投影为活动协议。</p><h2>关键承诺</h2><ul><li>同一时刻只有一个活动 mesh backend。</li><li>切换协议不合并身份、NodeId、密钥或消息去重空间。</li><li>启动失败不能显示新协议已可用。</li></ul><h2>下钻</h2><ul><li><a href="configure-radio-parameters/activity.html">协议切换活动图</a></li><li><a href="configure-radio-parameters/sequences/sequence-configure-radio-parameters.html">Settings 到 backend 时序</a></li></ul></main></body></html>
