<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>手机应用协议互操作</title></head><body><main data-praxis-anchor="model:phone-interoperability" data-praxis-kind="uml_model" data-praxis-status="confirmed"><h1>手机应用协议互操作</h1><p>共同入口是 <code>IPhoneAppFacade</code>。它暴露 time、location、device status、config patch 和 typed command；不是 BLE transport API，也不存在名为 PhoneFacade 的具体类。</p><h2>协议边界</h2><p>MeshtasticPhoneCore 与 MeshCorePhoneCore 保留各自 wire command、queue 和配置语义；共同 Facade 只统一应用意图与结果。</p><p><a href="phone-session.html">下钻：IPhoneAppFacade 到协议 core</a></p></main></body></html>
